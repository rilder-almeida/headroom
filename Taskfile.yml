version: '3'

vars:
  V: '{{.V | default "1"}}'

tasks:
  lint:
    desc: Validate the mod manifest and module, types included
    cmds:
      - claude plugin validate --strict . {{.CLI_ARGS}}

  test:
    desc: Run the mod's tests
    cmds:
      - claude plugin test . {{.CLI_ARGS}}

  ci:
    desc: Lint, then test
    cmds:
      - task: lint
      - task: test
